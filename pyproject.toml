[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthshell"
version = "1.2.1"
authors = [
  { name="subnarcher" },
]
description = "Framework for console software"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.hatch.build.targets.wheel]
include = [
    "synthshell.py",
    "shell_errors.py"
]
[tool.hatch.build.targets.wheel]
packages = ["src/synthshell"]
